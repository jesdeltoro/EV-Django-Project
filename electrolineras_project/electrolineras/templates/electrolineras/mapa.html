{% extends 'core/base.html' %}
{% load static %}

{% block title %}Mapa de Puntos de Recarga{% endblock %}

{% block content %}
<div style="background-color: rgba(75, 0, 130, 0.7); padding: 20px 0 30px 0;">
  <div class="container">
    <h1 style="color: white; margin-bottom: 20px;">Mapa de Puntos de Recarga</h1>
    <div id="map" style="height: 600px; width: 100%; margin-bottom: 20px; border-radius: 5px;"></div>
  </div>
</div>

<!-- CSS de Leaflet y MarkerCluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<!-- JavaScript de Leaflet y MarkerCluster -->
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
  // Función para obtener el token CSRF de las cookies
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        // Does this cookie string begin with the name we want?
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function reservarPunto(puntoId, marker) {
    fetch('/electrolineras/api/reservas/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
        // Si usas JWT, añade también el Authorization aquí
      },
      body: JSON.stringify({ punto: puntoId })
    })
    .then(response => response.json())
    .then(data => {
      if (data.detail) {
        alert(data.detail);
      } else {
        alert('Reserva realizada con éxito');
        marker.closePopup();
        location.reload();
      }
    });
  }

  function formatRemainingTime(milliseconds) {
    if (milliseconds <= 0) return "00:00";
    const totalSeconds = Math.floor(milliseconds / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }

  function startCountdown(elementId, fechaExpiracion) {
    function updateCountdown() {
      const now = new Date();
      const expiry = new Date(fechaExpiracion);
      const remaining = expiry - now;
      const el = document.getElementById(elementId);
      if (el) {
        el.textContent = formatRemainingTime(remaining);
        if (remaining <= 0) {
          clearInterval(interval);
          el.textContent = "00:00";
        }
      }
    }
    updateCountdown();
    const interval = setInterval(updateCountdown, 1000);
  }

  // Usar coordenadas del primer punto de la base de datos o valores por defecto
  {% if puntos and puntos|length > 0 %}
    var centroLat = parseFloat("{{ centro_lat|stringformat:'f' }}".replace(',', '.'));
    var centroLon = parseFloat("{{ centro_lon|stringformat:'f' }}".replace(',', '.'));
  {% else %}
    var centroLat = 36.7213;
    var centroLon = -4.4214;
  {% endif %}
  
  var map = L.map('map').setView([centroLat, centroLon], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Función para obtener y mostrar los puntos de recarga
  function loadChargingPoints() {
    fetch('/electrolineras/api/puntos/')
      .then(response => response.json())
      .then(data => {
        var markers = L.markerClusterGroup();
        data.forEach(point => {
          let popupContent = `
            <strong>${point.nombre}</strong><br>
            ${point.direccion}<br>
            Potencia: ${point.potencia_kw} kW<br>
            Conector: ${point.tipo_conector}<br>
          `;
          if (point.reservado) {
            popupContent += `<div style="margin-top:8px;"><strong>Reservado por: ${point.reservado_por || 'Desconocido'}</strong></div>`;
            if (point.fecha_expiracion) {
              const countdownId = `countdown-${point.id}`;
              popupContent += `<div><strong>Tiempo restante: <span id="${countdownId}"></span></strong></div>`;
            }
          }
          popupContent += `
            <div style="display: flex; justify-content: center; gap: 10px; margin-top: 8px;">
              <a href="https://www.google.com/maps/dir/?api=1&destination=${point.latitud},${point.longitud}" target="_blank" style="padding: 6px 12px; background: #4B0082; color: #fff; border-radius: 4px; text-decoration: none; font-size: 14px;">Cómo llegar</a>
              ${!point.reservado ? `<button onclick="reservarPunto('${point.id}', this.closest('.leaflet-popup'))" style="padding: 6px 12px; background: #228B22; color: #fff; border-radius: 4px; text-decoration: none; font-size: 14px; border: none; cursor: pointer;">Reservar</button>` : ''}
            </div>
          `;
          var marker = L.marker([point.latitud, point.longitud], {
            icon: L.icon({
              iconUrl: "{% static 'electrolineras/img/electricar.png' %}",
              iconSize: [32, 32],
              iconAnchor: [16, 32],
              popupAnchor: [0, -32]
            })
          }).bindPopup(popupContent);

          marker.on('popupopen', function() {
            if (point.reservado && point.fecha_expiracion) {
              startCountdown(`countdown-${point.id}`, point.fecha_expiracion);
            }
          });

          markers.addLayer(marker);
        });
        map.addLayer(markers);
      })
      .catch(error => console.error('Error al cargar los puntos de recarga:', error));
  }

  // Cargar los puntos de recarga al iniciar el mapa
  loadChargingPoints();
</script>
{% endblock %}
