{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mapa de Puntos de Recarga</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    #map {
      height: 600px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Mapa de Puntos de Recarga</h1>
  <div id="map"></div>
  <div>
    <strong>Debug puntos:</strong>
    <ul>
      {% for punto in puntos %}
        <li>{{ punto.nombre }} | {{ punto.latitud }} | {{ punto.longitud }}</li>
      {% empty %}
        <li>No hay puntos en la base de datos.</li>
      {% endfor %}
    </ul>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    // Definir la URL del icono personalizado
    var iconUrl = "{% static 'electrolineras/img/electricar.png' %}";

    // Crear el icono personalizado
    var customIcon = L.icon({
      iconUrl: iconUrl,
      iconSize: [32, 32], // ajusta el tamaño según tu imagen
      iconAnchor: [16, 32], // punto del icono que corresponde a la ubicación
      popupAnchor: [0, -32] // posición del popup respecto al icono
    });

    // Usar coordenadas del primer punto de la base de datos o valores por defecto
    {% if puntos and puntos|length > 0 %}
      var centroLat = parseFloat("{{ centro_lat|stringformat:'f' }}".replace(',', '.'));
      var centroLon = parseFloat("{{ centro_lon|stringformat:'f' }}".replace(',', '.'));
    {% else %}
      var centroLat = 36.7213;
      var centroLon = -4.4214;
    {% endif %}
    var map = L.map('map').setView([centroLat, centroLon], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    {% for punto in puntos %}
      var lat = parseFloat("{{ punto.latitud }}".replace(',', '.'));
      var lon = parseFloat("{{ punto.longitud }}".replace(',', '.'));
      console.log("Marcador:", "{{ punto.nombre }}", lat, lon);
      if (!isNaN(lat) && !isNaN(lon) && lat !== 0 && lon !== 0) {
        L.marker([lat, lon], { icon: customIcon })
          .addTo(map)
          .bindPopup(`
            <strong>{{ punto.nombre|escapejs }}</strong><br>
            {{ punto.direccion|escapejs }}<br>
            Potencia: {{ punto.potencia_kw }} kW<br>
            Conector: {{ punto.tipo_conector.denominacion|escapejs }}<br>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}" target="_blank">Cómo llegar</a>
          `);
      }
    {% endfor %}
  </script>
</body>
</html>
