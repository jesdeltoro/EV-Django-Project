{%extends 'core/base.html' %}
{% load static %}
{% block title %}Eliminar página{% endblock %}

{% block content %}
{% include 'pages/includes/pages_menu.html' %}
<main role="main">
    <div class="container">
        <div class="row mt-3">
            <div class="col-md-9 mx-auto">
                <div>
                    <h2>Eliminar página</h2>
                    <p>¿Estás seguro de que deseas eliminar la página "{{ page.title }}"?</p>
                    <form action="" method="POST">
                        {% csrf_token %}
                        <div class="d-flex justify-content-end" style="gap: 0.5rem;">
                            <input type="submit" class="btn btn-danger" value="Eliminar página" />
                            <a href="{% url 'pages:page' page.id page.title|slugify %}" class="btn btn-success">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
