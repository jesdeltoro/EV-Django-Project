<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Pago con Stripe</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        .StripeElement {
            box-sizing: border-box;
            height: 40px;
            padding: 10px 12px;
            border: 2px solid #dc3545; /* rojo */
            border-radius: 4px;
            background-color: #ffeaea; /* fondo rojo claro */
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .StripeElement--focus {
            border-color: #b71c1c; /* rojo más oscuro al enfocar */
        }
        #card-errors {
            color: red;
        }
    </style>
</head>
<body>
    <h2>Formulario de Pago</h2>
    <form id="payment-form">
        {% csrf_token %}
        <label for="factura-select">Selecciona una factura:</label>
        <select id="factura-select" required>
            <option value="">-- Selecciona una factura --</option>
            {% for factura in facturas %}
                <option value="{{ factura.id }}" data-total="{{ factura.total }}">
                    Factura #{{ factura.id }} - {{ factura.total }} €
                </option>
            {% endfor %}
        </select>
        <p id="importe-pagar" style="margin-top:10px;">Importe a pagar: <strong>--</strong></p>
        <div id="card-element"></div>
        <div id="card-errors" role="alert"></div>
        <button type="submit">Pagar</button>
    </form>

    <script>
        var stripe = Stripe('{{ stripe_public_key }}');
        var elements = stripe.elements();
        var card = elements.create('card');
        card.mount('#card-element');

        // Mostrar el importe al seleccionar una factura
        var facturaSelect = document.getElementById('factura-select');
        var importePagar = document.getElementById('importe-pagar');
        var selectedFacturaId = null;

        facturaSelect.addEventListener('change', function() {
            var selectedOption = facturaSelect.options[facturaSelect.selectedIndex];
            var total = selectedOption.getAttribute('data-total');
            selectedFacturaId = facturaSelect.value;
            if (total) {
                importePagar.innerHTML = 'Importe a pagar: <strong>' + total + ' €</strong>';
            } else {
                importePagar.innerHTML = 'Importe a pagar: <strong>--</strong>';
            }
        });

        card.on('change', function(event) {
            var displayError = document.getElementById('card-errors');
            displayError.textContent = event.error ? event.error.message : '';
        });

        var form = document.getElementById('payment-form');
        form.addEventListener('submit', function(event) {
            event.preventDefault();

            if (!selectedFacturaId) {
                alert('Selecciona una factura.');
                return;
            }

            fetch('/payments/api/crear-payment-intent/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    factura_id: selectedFacturaId
                })
            })
            .then(response => response.json())
            .then(data => {
                if (!data.success) {
                    alert('Error: ' + data.error);
                    return;
                }
                var clientSecret = data.clientSecret;

                stripe.confirmCardPayment(clientSecret, {
                    payment_method: {
                        card: card
                    }
                }).then(function(result) {
                    if (result.error) {
                        document.getElementById('card-errors').textContent = result.error.message;
                    } else {
                        if (result.paymentIntent.status === 'succeeded') {
                            alert('Pago realizado correctamente');
                            // Aquí puedes redirigir o actualizar la UI
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
