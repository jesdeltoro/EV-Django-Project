<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Básica de Stripe</title>
  <script src="https://js.stripe.com/basil/stripe.js"></script>
  <style>
    #card-element {
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 4px;
    }
    #card-errors {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Prueba Básica de Stripe</h1>
  <form id="payment-form">
    <div id="card-element" class="form-control" style="height: 50px; padding: 10px 14px; border: 1px solid #ced4da; border-radius: 4px; background-color: white; transition: all 0.3s ease; box-shadow: 0 1px 3px rgba(50, 50, 93, 0.15); z-index: 1;"></div>
    <div id="card-errors" role="alert"></div>
    <button type="submit">Pagar</button>
  </form>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      STRIPE_SECRET_KEY = 'pk_test_51RSBOfQFcvigGkXXijjkijmBd62X9byrfX8BA9NLUARc60ZwoaqvrNx9DkcwEZqahbjnIFhn2H5eDUSKYIzf7fMH00K6OcsDPl'       # Clave secreta de prueba
      const stripe = Stripe('STRIPE_SECRET_KEY'); // Reemplaza con tu clave pública de Stripe
      const elements = stripe.elements();
      const cardElement = elements.create('card', {
        style: {
          base: {
            color: '#32325d',
            fontFamily: 'Arial, sans-serif',
            fontSmoothing: 'antialiased',
            fontSize: '16px',
            '::placeholder': { color: '#aab7c4' }
            padding: '12px',
            lineHeight: '24px',
          },
          invalid: {
            color: '#fa755a',
            iconColor: '#fa755a'
          }
        }
      });
      cardElement.mount('#card-element');

      cardElement.on('ready', () => {
        console.log('El elemento de tarjeta está listo');
      });

      const form = document.getElementById('payment-form');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const { error, paymentMethod } = await stripe.createPaymentMethod({
          type: 'card',
          card: cardElement,
        });

        if (error) {
          document.getElementById('card-errors').textContent = error.message;
        } else {
          alert('Método de pago creado con éxito: ' + paymentMethod.id);
        }
      });
    });
  </script>
</body>
</html>
